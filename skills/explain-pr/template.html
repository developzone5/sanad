<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>PR Lessons</title>
<style>
/* Light by default; dark follows the system unless data-theme="light", or when data-theme="dark". */
:root {
  --bg: #f5f6f9; --panel: #ffffff; --panel-2: #f1f3f7; --ink: #111521; --soft: #3b4253; --muted: #667085; --line: #e1e4ec;
  --accent: #2d5bff; --accent-soft: #eaf0ff; --accent-ink: #ffffff;
  --bad: #c62828; --bad-soft: #fdecec; --good: #13804a; --good-soft: #e7f6ee; --warn: #a15c00; --warn-soft: #fff3df;
  --fix: #a15c00; --feature: #13804a; --cleanup: #5b6475;
  --code-bg: #fbfbfd; --add-bg: #e9f8ef; --del-bg: #fdeeee; --ln: #9aa3b2; --note-bg: #f6f8ff;
  --t-kw: #7c3aed; --t-str: #0f766e; --t-num: #b45309; --t-com: #8a93a3; --t-typ: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1016; --panel: #151922; --panel-2: #1b2130; --ink: #f2f4f8; --soft: #d0d6e2; --muted: #a9b2c3; --line: #2a3141;
    --accent: #7aa7ff; --accent-soft: #1c2a47; --accent-ink: #0d1016;
    --bad: #ff7b7b; --bad-soft: #3a1d22; --good: #4fe39a; --good-soft: #15342a; --warn: #ffbf5c; --warn-soft: #3a2c14;
    --fix: #ffbf5c; --feature: #4fe39a; --cleanup: #a9b2c3;
    --code-bg: #10141c; --add-bg: rgba(46, 160, 67, .14); --del-bg: rgba(248, 81, 73, .14); --ln: #5b6578; --note-bg: #182033;
    --t-kw: #c792ea; --t-str: #a5d6a7; --t-num: #ffab70; --t-com: #6b7686; --t-typ: #82cfff;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1016; --panel: #151922; --panel-2: #1b2130; --ink: #f2f4f8; --soft: #d0d6e2; --muted: #a9b2c3; --line: #2a3141;
  --accent: #7aa7ff; --accent-soft: #1c2a47; --accent-ink: #0d1016;
  --bad: #ff7b7b; --bad-soft: #3a1d22; --good: #4fe39a; --good-soft: #15342a; --warn: #ffbf5c; --warn-soft: #3a2c14;
  --fix: #ffbf5c; --feature: #4fe39a; --cleanup: #a9b2c3;
  --code-bg: #10141c; --add-bg: rgba(46, 160, 67, .14); --del-bg: rgba(248, 81, 73, .14); --ln: #5b6578; --note-bg: #182033;
  --t-kw: #c792ea; --t-str: #a5d6a7; --t-num: #ffab70; --t-com: #6b7686; --t-typ: #82cfff;
}
* { box-sizing: border-box; }
/* Keep scrolled-to items clear of the sticky top bar and the fixed Back / Next bar. */
html { scroll-padding-top: 130px; scroll-padding-bottom: 96px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.75 "Segoe UI", system-ui, -apple-system, Tahoma, "Noto Sans Arabic", Arial, sans-serif; }
button { font: inherit; color: inherit; }
code, pre, .code { font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace; }
/* Show code exactly as typed: no ligatures turning => into ⇒ or != into ≠. */
code, pre, .code, .cl { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
/* Letter spacing breaks the joined letters of Arabic words. */
html[lang="ar"] * { letter-spacing: 0 !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar: the PR, the lessons, the language */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1040px; margin: 0 auto; padding: 12px 20px 0; }
.row1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
.prn { flex: none; font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); direction: ltr; }
.ttl { flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 4px 14px; font-size: 14px; cursor: pointer; }
.lang:hover { border-color: var(--accent); }
.lessons { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 0; }
.lessons::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 9px; border: 0; background: none; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-size: 15px; white-space: nowrap; }
.pill:hover { color: var(--ink); }
.pill[aria-current="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--accent); }
.pill .n { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel-2); color: var(--muted); }
.pill[aria-current="true"] .n { background: var(--accent); color: var(--accent-ink); }

/* Page */
main { max-width: 1040px; margin: 0 auto; padding: 26px 20px 120px; }
.page { animation: enter .3s ease; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.kind { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: var(--kc); background: color-mix(in srgb, var(--kc) 14%, transparent); }
.k-fix { --kc: var(--fix); } .k-feature { --kc: var(--feature); } .k-cleanup { --kc: var(--cleanup); }
h2.big { font-size: clamp(26px, 3.6vw, 36px); line-height: 1.3; margin: 10px 0 8px; }
.lead { font-size: 19px; color: var(--soft); margin: 0 0 22px; }

/* The journey: one example travels through the layers in 3D; one station is where the change acts */
.journey { position: relative; margin: 14px 0 6px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, var(--accent-soft), transparent 70%), var(--panel); }
.journey .stage3d { position: relative; height: 300px; }
.journey canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.journey .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px 0; position: relative; z-index: 2; }
.journey .hud p { margin: 0; flex: 1; min-width: 200px; font-size: 16px; color: var(--soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 16px; font-size: 15px; cursor: pointer; color: var(--muted); }
.seg button.b[aria-pressed="true"] { background: var(--bad); color: #fff; font-weight: 650; }
.seg button.a[aria-pressed="true"] { background: var(--good); color: #fff; font-weight: 650; }
.lbl3d { position: absolute; left: 0; top: 0; transform: translate(-50%, 0); pointer-events: none; text-align: center; font-size: 14px; font-weight: 650; color: var(--soft); white-space: nowrap; }
.lbl3d small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
.lbl3d.hot { color: var(--ink); }
.card3d { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .55); font-size: 14px; font-weight: 650; white-space: nowrap; }
.card3d .chip { transition: background .3s, color .3s; }
.flat { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 26px 16px; }
.flat .st { padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; }
.flat .st.hot { border-color: var(--accent); background: var(--accent-soft); }

.lbl3d svg { display: block; width: 20px; height: 20px; margin: 0 auto 2px; fill: none; stroke: var(--ic, currentColor); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card3d .ct { display: flex; flex-direction: column; line-height: 1.25; }
.card3d .ct small { font-size: 11px; font-weight: 600; color: var(--muted); unicode-bidi: plaintext; }
.bubble3d { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; max-width: 240px; padding: 6px 12px; border-radius: 12px; font-size: 14px; font-weight: 650; text-align: center; white-space: normal; transition: opacity .3s, transform .3s; background: var(--panel); border: 1px solid var(--line); }
.bubble3d.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.bubble3d.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.bubble3d.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.casepick { position: relative; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px 0; font-size: 14px; color: var(--muted); }
.casechip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px; font-size: 14px; cursor: pointer; direction: ltr; unicode-bidi: plaintext; }
.casechip:hover { border-color: var(--accent); }
.casechip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
.flat .st svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; margin-inline-end: 6px; }

/* The lab: pick values, compare the old and new result */
.lab { position: relative; z-index: 2; border-top: 1px solid var(--line); padding: 14px 16px 12px; background: color-mix(in srgb, var(--panel) 80%, transparent); }
.lab-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.lab-h b { font-size: 17px; }
.lab-h span { color: var(--muted); font-size: 15px; }
.lab-in { display: flex; flex-wrap: wrap; gap: 10px 16px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 140px; }
.fld input.time:invalid { border-color: var(--bad); }
.fld select, .fld input.time, .fld input[type="number"] { font: inherit; font-size: 16px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 40px; }
.fld input.time, .fld input[type="number"] { direction: ltr; text-align: center; font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
.fld input:disabled { opacity: .45; }
.fld .none { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.lab-pre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.lab-out { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; margin-top: 12px; }
.lab-out .o { flex: 1 1 160px; border-radius: 14px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); }
.lab-out .o small { display: block; font-size: 13px; color: var(--muted); }
.lab-out .o b { font-size: 22px; }
.lab-out .o.old.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: var(--bad-soft); } .lab-out .o.old.bad b { color: var(--bad); }
.lab-out .o.new { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); background: var(--good-soft); } .lab-out .o.new b { color: var(--good); }
.lab-out .diff { align-self: center; font-size: 13px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 3px 12px; border-radius: 999px; }
.lab-note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

/* The story in three lines, and the screens side by side */
.story { padding: 16px 20px; }
.sline { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; }
.sline + .sline { border-top: 1px dashed var(--line); }
.sline .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; }
.sline.bad .ic { background: var(--bad); } .sline.warn .ic { background: var(--warn); } .sline.good .ic { background: var(--good); }
.sline small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.sline p { margin: 0; font-size: 18px; line-height: 1.65; }
.mockpair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
.mockpair figure { margin: 0; }
.mockpair figcaption { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.mockpair figcaption.bad { color: var(--bad); } .mockpair figcaption.good { color: var(--good); }
.stitle { margin: 4px 0 0; font-size: 16px; color: var(--soft); }
details.more { margin-top: 14px; }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 15px; }
.proofline summary { cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 16px; font-weight: 600; }
.proofline .gwt { margin-top: 12px; }

/* The one sentence to remember */
.takeaway { display: flex; gap: 12px; align-items: flex-start; margin: 6px 0 4px; padding: 14px 18px; border-radius: 16px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: 19px; font-weight: 600; line-height: 1.6; }
.takeaway b { flex: none; font-size: 13px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 2px 10px; border-radius: 999px; margin-top: 4px; }

/* Check yourself */
.quiz .q { margin: 0 0 12px; font-size: 19px; font-weight: 600; }
.qopts { display: flex; flex-wrap: wrap; gap: 10px; }
.qopt { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 9px 16px; font-size: 17px; cursor: pointer; }
.qopt:hover:not(:disabled) { border-color: var(--accent); }
.qopt.right { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 650; }
.qopt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.qopt:disabled { cursor: default; }
.qans { margin: 12px 0 0; font-size: 17px; }
.qans b { margin-inline-end: 6px; }
.qans.right b { color: var(--good); } .qans.wrong b { color: var(--bad); }

/* Sections of a lesson */
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; margin: 16px 0; }
.sec h3 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 10px; color: var(--soft); }
.sec h3 .no { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--accent-ink); background: var(--accent); flex: none; }
.sec.bad h3 .no { background: var(--bad); } .sec.good h3 .no { background: var(--good); } .sec.warn h3 .no { background: var(--warn); }
.say { margin: 0; font-size: 20px; line-height: 1.7; }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: center; }

/* A small picture of the screen the user saw */
.mock { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel-2); }
.mock .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.mock .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.mock .bar span { margin-inline-start: 6px; }
.mock ul { list-style: none; margin: 0; padding: 6px 0; }
.mock li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 14px; font-size: 16px; }
.mock li + li { border-top: 1px dashed var(--line); }
.chip { flex: none; font-size: 14px; font-weight: 650; padding: 2px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.mock.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.mock.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }

/* Code with its meaning beside each line */
.snip { margin: 12px 0 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--code-bg); }
.snip-h { display: flex; justify-content: space-between; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); direction: ltr; }
.snip-h code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.lines > .cl, .lines > .nt { padding: 3px 0; min-height: 30px; }
/* The `font` shorthand resets ligatures, so they are turned off again after it: code shows exactly as typed. */
.cl { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr); direction: ltr; text-align: left; font: 14px/1.7 "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
.cl .n { color: var(--ln); text-align: right; padding-right: 10px; user-select: none; }
.cl .m { color: var(--ln); user-select: none; }
.cl .t { white-space: pre-wrap; overflow-wrap: anywhere; padding-inline-end: 12px; }
.cl.add { background: var(--add-bg); } .cl.add .m { color: var(--good); }
.cl.del { background: var(--del-bg); } .cl.del .m { color: var(--bad); } .cl.del .t { opacity: .85; }
.cl.has { box-shadow: inset 3px 0 0 var(--accent); }
.nt { font-size: 15px; line-height: 1.55; color: var(--soft); padding-inline: 14px !important; border-inline-start: 1px solid var(--line); display: flex; align-items: center; }
.nt.has { background: var(--note-bg); color: var(--ink); }
.nt.has::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-inline-end: 8px; flex: none; }
.tk-kw { color: var(--t-kw); } .tk-str { color: var(--t-str); } .tk-num { color: var(--t-num); } .tk-com { color: var(--t-com); font-style: italic; } .tk-typ { color: var(--t-typ); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; background: var(--c); }

/* The code walk: the request's path through the code, one card per layer */
.walk .whint { margin: 0 0 12px; font-size: 15px; color: var(--muted); }
.wnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 14px; }
.wsep { color: var(--muted); font-size: 14px; }
.wbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 12px 4px 6px; font-size: 14px; cursor: pointer; }
html[dir="rtl"] .wbtn { padding: 4px 6px 4px 12px; }
.wbtn:hover { border-color: var(--accent); }
.wbtn[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.wbtn.hot { box-shadow: inset 0 0 0 1px var(--accent); }
.wbtn .wn { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel); color: var(--soft); }
.wbtn svg, .wstep-h svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--ic, currentColor); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wstep { border: 1px solid var(--line); border-inline-start: 4px solid var(--ic, var(--line)); border-radius: 16px; padding: 14px 16px; background: var(--panel); outline: none; }
.wstep + .wstep { margin-top: 12px; }
.wstep.hot { box-shadow: 0 0 0 3px var(--accent-soft); }
.wstep:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.wstep-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.wstep-h .no { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--accent-ink); background: var(--accent); flex: none; }
.wstep-h b { font-size: 17px; }
.wstep-h .layer { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.wstep-h .tag.hot { color: var(--accent-ink); background: var(--accent); }
.wstep-h .tag.same { color: var(--muted); background: var(--panel-2); font-weight: 600; }
.wstep .does { margin: 8px 0 0; font-size: 17px; line-height: 1.6; }
.wfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; margin-top: 10px; }
.wpass { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 0; font-size: 14px; color: var(--muted); }
.wpass .arrow { font-size: 17px; color: var(--accent); }
.wpass .v { color: var(--soft); font-weight: 600; unicode-bidi: plaintext; }
.wnext { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 650; font-size: 15px; cursor: pointer; }
.wnext:hover { text-decoration: underline; }
/* A station that opens its code: the 3D labels take clicks only then. */

    // Proof in one line (details on demand), then one question.
    var t = c.test, pf = el('section', 'sec proofline');
    if (!t) pf.appendChild(el('p', null, T.noTest));
    else {
      var d = el('details'), sm = el('summary');
      sm.appendChild(el('span', 'tag ' + (t.result === 'pass' ? 'pass' : t.result === 'fail' ? 'fail' : 'wait'), t.result === 'pass' ? T.pass : t.result === 'fail' ? T.fail : T.notRun));
      sm.appendChild(document.createTextNode(T.provedBy + ' ' + tx(t.name)));
      d.appendChild(sm);
      var g = el('div', 'gwt');
      [['given', t.given], ['when', t.when], ['then', t.then]].forEach(function (p) { if (!p[1]) return; g.appendChild(el('b', null, T[p[0]])); g.appendChild(el('span', null, tx(p[1]))); });
      d.appendChild(g);
      if (t.file) d.appendChild(el('div', 'tfile', tx(t.file)));
      pf.appendChild(d);
    }
    box.appendChild(pf);

    // One question to check the lesson landed: pick an answer, see right or wrong and why.
    if (c.quiz) {
      var qz = el('section', 'sec quiz'), qh = el('h3'); qh.appendChild(document.createTextNode(T.quiz)); qz.appendChild(qh);
      qz.appendChild(el('p', 'q', tx(c.quiz.q)));
      var opts = el('div', 'qopts'), ans = el('p', 'qans'); ans.hidden = true;
      arr(c.quiz.options).forEach(function (o) {
        var b = el('button', 'qopt', tx(o.text)); b.type = 'button';
        b.addEventListener('click', function () {
          opts.querySelectorAll('.qopt').forEach(function (x, k) { x.disabled = true; if (c.quiz.options[k].correct) x.classList.add('right'); });
          if (!o.correct) b.classList.add('wrong');
          ans.className = 'qans ' + (o.correct ? 'right' : 'wrong'); ans.replaceChildren(el('b', null, o.correct ? T.right : T.wrong), document.createTextNode(tx(c.quiz.explain)));
          ans.hidden = false;
        });
        opts.appendChild(b);
      });
      qz.appendChild(opts); qz.appendChild(ans); box.appendChild(qz);
    }
  }
  // Without a lab or a journey, the cases still show as a small table: same inputs, old and new result.
  function casesTable(cases) {
    var s = el('section', 'sec'), wrap = el('div', 'casewrap'), table = el('table', 'cases'), thead = el('thead'), hr = el('tr');
    var h = el('h3'); h.appendChild(document.createTextNode(T.cases)); s.appendChild(h);
    arr(cases.inputs).forEach(function (x) { hr.appendChild(el('th', null, tx(x))); });
    hr.appendChild(el('th', null, T.before)); hr.appendChild(el('th', null, T.after));
    thead.appendChild(hr); table.appendChild(thead);
    var tb = el('tbody');
    arr(cases.rows).forEach(function (r) {
      var tr = el('tr', tx(r.old && r.old.text) !== tx(r.now && r.now.text) || (r.old && r.old.ok) !== (r.now && r.now.ok) ? 'diff' : '');
      arr(r.values).forEach(function (v) { tr.appendChild(el('td', 'v', tx(v))); });
      [r.old, r.now].forEach(function (o) { var td = el('td'); td.appendChild(el('span', 'res ' + (o && o.ok ? 'ok' : 'no'), tx(o && o.text))); tr.appendChild(td); });
      tb.appendChild(tr);
    });
    table.appendChild(tb); wrap.appendChild(table); s.appendChild(wrap);
    return s;
  }
  function mockOf(c, side) { return c.mock ? mock(c.mock, side, side === 'before' ? 'bad' : 'good') : null; }
  function end(box) {
    box.appendChild(el('span', 'kind k-cleanup', T.summary));
    box.appendChild(el('h2', 'big', tx(story.title)));
    lessonCards(box, false);
    var three = el('div', 'three');
    function list(title, items, row) { var s = el('section', 'sec box'); s.appendChild(el('h3', null, title)); var ul = el('ul'); if (!items.length) ul.appendChild(el('li', null, T.none)); items.forEach(function (x) { ul.appendChild(row(x)); }); s.appendChild(ul); return s; }
    three.appendChild(list(T.checks, proof, function (p) { var l = el('li', null, (p.result === 'pass' ? '✓ ' : p.result === 'fail' ? '✕ ' : '• ') + tx(p.name)); l.appendChild(el('small', null, [tx(p.file), p.result === 'pass' ? T.pass : p.result === 'fail' ? T.fail : T.notRun].filter(Boolean).join(' · '))); return l; }));
    three.appendChild(list(T.risks, arr(story.risks), function (x) { return el('li', null, tx(x)); }));
    three.appendChild(list(T.notDone, arr(story.notDone), function (x) { return el('li', null, tx(x)); }));
    box.appendChild(three);
    var d = el('details', 'sec files'); d.appendChild(el('summary', null, T.allFiles + ' (' + files.length + ')'));
    var ul = el('ul');
    files.forEach(function (f) {
      var owners = lessons.map(function (c, i) { return arr(c.files).indexOf(f) >= 0 ? i + 1 : null; }).filter(Boolean);
      var l = el('li'); l.appendChild(el('code', null, f)); l.appendChild(document.createTextNode(owners.length ? ' — ' + T.lesson + ' ' + owners.join(lang === 'ar' ? '، ' : ', ') : ' — ' + T.missing)); ul.appendChild(l);
    });
    d.appendChild(ul); box.appendChild(d);
  }

  // ---------- navigation ----------
  var pillEls = [];
  function buildTop() {
    $('prn').textContent = pr.number ? 'PR #' + pr.number : (pr.branch || 'PR');
    $('ttl').textContent = tx(story.title);
    $('lang').textContent = T.other; $('lang').lang = lang === 'ar' ? 'en' : 'ar';
    var nav = $('lessons'); nav.replaceChildren(); nav.setAttribute('aria-label', T.lessons);
    pillEls = pages.map(function (p, i) {
      var b = el('button', 'pill'); b.type = 'button';
      if (p === 'overview') b.appendChild(el('span', null, T.overview));
      else if (p === 'end') b.appendChild(el('span', null, T.summary));
      else { b.appendChild(el('span', 'n', p + 1)); b.appendChild(el('span', null, tx(lessons[p].name))); }
      b.addEventListener('click', function () { show(i); });
      nav.appendChild(b); return b;
    });
    $('back').textContent = T.back;
  }
  function show(i) {
    if (i < 0 || i >= pages.length) return;
    at = i; var p = pages[i], box = el('div', 'page');
    if (stopJourney) { stopJourney(); stopJourney = null; }
    if (p === 'overview') overview(box); else if (p === 'end') end(box); else lesson(box, lessons[p], p);
    $('main').replaceChildren(box);
    if (box._journey) { box._journey.start(); stopJourney = box._journey.stop; }
    window.scrollTo(0, 0);
    pillEls.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    var cur = pillEls[i], nav = $('lessons'), cb = cur.getBoundingClientRect(), nb = nav.getBoundingClientRect();
    if (cb.left < nb.left || cb.right > nb.right) nav.scrollLeft += lang === 'ar' ? cb.right - nb.right + 16 : cb.left - nb.left - 16;
    $('back').disabled = i === 0;
    $('next').disabled = i === pages.length - 1;
    $('next').textContent = i === 0 ? T.start : i === pages.length - 2 ? T.finish : T.next;
    $('where').textContent = p === 'overview' ? T.overview : p === 'end' ? T.summary : T.lesson + ' ' + frac(p + 1, lessons.length) + ' · ' + tx(lessons[p].name);
    try { history.replaceState(null, '', '#' + i); } catch (e) { /* a sandboxed frame may refuse */ }
  }
  function applyLang() {
    T = WORDS[lang];
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = tx(story.title) || 'PR Lessons';
    buildTop(); show(at);
  }
  $('lang').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(STORE, lang); } catch (e) { /* storage may be blocked */ }
    applyLang();
  });
  $('back').addEventListener('click', function () { show(at - 1); });
  $('next').addEventListener('click', function () { show(at + 1); });
  addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SUMMARY)$/.test(e.target.tagName)) return;
    var fwd = lang === 'ar' ? 'ArrowLeft' : 'ArrowRight', bwd = lang === 'ar' ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === fwd) { e.preventDefault(); show(at + 1); } else if (e.key === bwd) { e.preventDefault(); show(at - 1); }
  });
  // A link to "#3" opens page 3, also when only the address changes.
  addEventListener('hashchange', function () { var h = parseInt((location.hash || '').slice(1), 10); if (h >= 0 && h < pages.length && h !== at) show(h); });
  var start = parseInt((location.hash || '').slice(1), 10);
  at = start >= 0 && start < pages.length ? start : 0;
  applyLang();
})();
</script>
</body>
</html>
